[theme]
# GitHub Dark Default (Primer). No built-in GitHub theme exists in Herdr, so
# this layers the GitHub Dark palette over a complete built-in dark base.
# NOTE: base must NOT be "terminal". The "terminal" theme derives every
# un-overridden token from the HOST terminal's ANSI palette; when that palette
# is unavailable or reports a dark foreground, Herdr UI text renders black on
# its dark surfaces (unreadable). "one-dark" supplies every token.
# Values: Primer dark default canvas/fg + ANSI accents.
name = "one-dark"

[theme.custom]
# surfaces
sidebar_bg    = "#010409"   # canvas.inset
panel_bg      = "#0d1117"   # canvas.default
active_row_bg = "#161b22"   # canvas.subtle
selection_bg  = "#1f6feb"   # accent.emphasis
surface0      = "#161b22"
surface1      = "#21262d"
surface_dim   = "#010409"
overlay0      = "#30363d"   # border.default
overlay1      = "#484f58"   # border.subtle
# text
text          = "#e6edf3"   # fg.default
subtext0      = "#8b949e"   # fg.muted
# accents
accent        = "#58a6ff"   # accent.fg
blue          = "#58a6ff"
green         = "#3fb950"   # success.fg
yellow        = "#d29922"   # attention.fg
red           = "#f85149"   # danger.fg
teal          = "#39c5cf"
peach         = "#f0883e"
mauve         = "#bc8cff"   # done.fg

[keys]
# Herdr's built-in edit_scrollback (prefix+e) hijacks the focused pane: it dumps
# that pane's scrollback to /tmp and replaces its process with $EDITOR (vi).
# Bound to a Notes pane it destroys the note pane. Disabled here; prefix+e is
# re-bound below to actually edit the workspace note.
edit_scrollback = ""

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "herdr-notes.toggle"
description = "Toggle workspace notes"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "herdr-notes.edit"
description = "Edit workspace note in editor"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "herdr-notes.edit"
description = "Edit workspace note in editor"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "agent-tasks.toggle"
description = "Toggle agent tasks"

